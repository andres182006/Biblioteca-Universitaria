api:
  version: 1.0.0
  tittle: API
  basePackege: com.biblioteca.universitaria
  descripcion: api para una biblioteca universitaria
  terms: https://

#server config
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api-biblioteca
    error:
      include-message: always
      include-binding-errors: always

#swagger-ui custom path
springdoc:
  api-docs:
    path: /api-biblioteca

#spring config
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: biblioteca
  datasource:
    url: jdbc:postgresql://localhost:5432/bibliotecauniversitaria
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
app:
  usuarios-iniciales:
    password: ${ADMIN_PASSWORD}
