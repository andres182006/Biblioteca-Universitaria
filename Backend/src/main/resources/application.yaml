api:
  version: 1.0.0
  tittle: API
  basePackege: com.biblioteca.universitaria
  descripcion: api para una biblioteca universitaria
  terms: https://

#server config
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api-biblioteca
    error:
      include-message: always
      include-binding-errors: always

#swagger-ui custom path
springdoc:
  api-docs:
    path: /v3/api-docs

#spring config
spring:
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: biblioteca
  #datasource:
   # url: ${DB_URL:jdbc:postgresql://localhost:5432/bibliotecauniversitaria}
    #username: ${DB_USERNAME:postgres}
    #password: ${DB_PASSWORD}
    #driver-class-name: org.postgresql.Driver
  datasource:
      url: ${urlsupa}
      username: ${usernamesupa}
      password: ${passwordsupa}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        data-source-properties:
          sslmode: require
app:
  usuarios-iniciales:
    password: ${ADMIN_PASSWORD}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
