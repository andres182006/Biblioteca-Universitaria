services:
  - type: web
    name: biblioteca-universitaria-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api-biblioteca/v3/api-docs
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        value: postgres.lvvgbrwrzgsaduwtwzmc
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200,https://biblioteca-universitaria.pages.dev
